schema: xgc2.product.v1
id: xgc2-ros-melodic-scout-description
name: XGC2 ROS Melodic Scout Description
version: 0.4.10-3
kind: ros1-apt
summary: ROS Melodic visual-only AgileX Scout meshes and URDF.
ros:
  distro: melodic
  packages:
  - scout_description
apt:
  distribution: bionic
  install:
  - ros-melodic-xgc2-scout-description
  packages:
  - ros-melodic-xgc2-scout-description
  package_architectures:
    ros-melodic-xgc2-scout-description:
    - amd64
    - arm64
  depends:
  - ros-melodic-urdf
usage:
  install: 'sudo apt update

    sudo apt install ros-melodic-xgc2-scout-description

    '
  smoke_test: 'test -f "$(rospack find scout_description)/urdf/scout_visual.urdf"

    test ! -d "$(rospack find scout_description)/launch"

    '
ownership:
  paths:
  - /opt/ros/melodic/share/scout_description
release:
  repository: XGC-Team/xgc2-scout-description
  ref: melodic
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    bionic: 0.4.10-3
