schema: xgc2.product.v1
id: xgc2-scout-description
name: XGC2 Scout Description
version: 0.4.10-14
kind: ros1-apt
summary: ROS Noetic visual-only AgileX Scout meshes and URDF.
ros:
  distro: noetic
  packages:
  - scout_description
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-scout-description
  packages:
  - ros-noetic-xgc2-scout-description
  package_architectures:
    ros-noetic-xgc2-scout-description:
    - amd64
    - arm64
  depends:
  - ros-noetic-urdf
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-scout-description

    '
  smoke_test: 'test -f "$(rospack find scout_description)/urdf/scout_visual.urdf"

    test ! -d "$(rospack find scout_description)/launch"

    '
ownership:
  paths:
  - /opt/ros/noetic/share/scout_description
release:
  repository: XGC-Team/xgc2-scout-description
  ref: noetic
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    focal: 0.4.10-14
