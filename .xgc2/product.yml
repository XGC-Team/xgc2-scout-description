schema: xgc2.product.v1
id: xgc2-ros-jazzy-scout-description
name: XGC2 ROS Jazzy Scout Description
version: 0.4.10-2
kind: ros2-apt
summary: ROS 2 Jazzy visual-only AgileX Scout meshes and URDF.
ros:
  distro: jazzy
  packages:
  - scout_description
apt:
  distribution: noble
  install:
  - ros-jazzy-xgc2-scout-description
  packages:
  - ros-jazzy-xgc2-scout-description
  package_architectures:
    ros-jazzy-xgc2-scout-description:
    - amd64
    - arm64
  depends:
  - ros-jazzy-urdf
usage:
  install: 'sudo apt update

    sudo apt install ros-jazzy-xgc2-scout-description

    '
  smoke_test: 'source /opt/ros/jazzy/setup.bash

    ros2 pkg prefix scout_description

    test -f /opt/ros/jazzy/share/scout_description/urdf/scout_visual.urdf

    '
ownership:
  paths:
  - /opt/ros/jazzy/share/scout_description
  - /opt/ros/jazzy/share/ament_index/resource_index/packages/scout_description
release:
  repository: XGC-Team/xgc2-scout-description
  ref: jazzy
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    noble: 0.4.10-2
